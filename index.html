<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>麦浪精灵 · Wisp Field</title>
    <style>
      /* 进入页：名字未定，标题/副标题均为占位文本，定名后只改下面两处即可。
         视觉沿用体验页语言：晨光底色、小满同款红点、纯色块 + 雾。 */
      :root {
        --sky: #f5efe0;
        --ink: #3a3630;
        --wisp: #c0453a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        cursor: none;
      }

      /* 本地手形光标：参考 Clarity Project 的 MIT 手形图标方向，避免依赖外部资源。
         位置由 JS 写 left/top（自身 lerp 平滑），transform 只做旋转/缩放，
         这样 .pressed 的按压动画不会被内联样式覆盖。 */
      .hand-cursor {
        position: fixed;
        left: 50vw;
        top: 50vh;
        z-index: 30;
        width: 76px;
        height: 76px;
        pointer-events: none;
        opacity: 0;
        --stroke-angle: 0deg;
        transform: rotate(calc(-12deg + var(--stroke-angle))) scale(0.84);
        transform-origin: 50% 58%;
        transition: opacity 0.22s ease, transform 0.22s cubic-bezier(.22,1,.36,1);
        filter: drop-shadow(0 8px 13px rgba(91, 61, 36, 0.18));
      }
      .hand-cursor.visible { opacity: 1; }
      .hand-cursor::before {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 199, 104, 0.28), rgba(255, 199, 104, 0) 70%);
        filter: blur(4px);
        transform: scale(0.84);
        transition: transform 0.3s ease, opacity 0.3s ease;
      }
      .hand-cursor svg { position: relative; width: 100%; height: 100%; overflow: visible; }
      .hand-cursor .hand-fill { fill: #fff8e9; stroke: #8d5b3a; stroke-width: 2.3; stroke-linejoin: round; }
      .hand-cursor .hand-warm { fill: #ffd27c; opacity: 0.42; }
      .hand-cursor.pressed { transform: rotate(calc(-4deg + var(--stroke-angle))) scale(0.72); }
      .hand-cursor.pressed::before { transform: scale(1.1); opacity: 0.8; }
      .hand-cursor.stroking svg { animation: strokePalm 0.42s ease-in-out infinite alternate; }
      @keyframes strokePalm {
        from { transform: translateY(0) rotate(-2deg); }
        to { transform: translateY(3px) rotate(3deg); }
      }
      @media (pointer: coarse) {
        body { cursor: auto; }
        .hand-cursor { display: none; }
      }

      /* 晨光：中上方的柔光晕，像麦田上将升的太阳 */
      .sun {
        position: fixed;
        left: 50%;
        top: 32%;
        width: min(58vmin, 440px);
        height: min(58vmin, 440px);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(224, 178, 106, 0.5) 0%,
          rgba(224, 178, 106, 0.16) 45%,
          rgba(224, 178, 106, 0) 70%
        );
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      /* 小满同款红点：麦田里那颗待唤醒的光 */
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--wisp);
        box-shadow: 0 0 18px rgba(192, 69, 58, 0.55);
        animation: bob 3.2s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      h1 {
        font-size: clamp(30px, 5.4vw, 46px);
        font-weight: 500;
        letter-spacing: 0.3em;
        /* 抵消 letter-spacing 造成的右侧多出的空隙，让文字视觉居中 */
        padding-left: 0.3em;
      }
      .sub {
        font-size: 13px;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        text-transform: uppercase;
        opacity: 0.55;
      }

      #enter {
        margin-top: 20px;
        padding: 13px 44px 13px calc(44px + 0.5em);
        font-family: inherit;
        font-size: 15px;
        letter-spacing: 0.5em;
        color: var(--ink);
        background: transparent;
        border: 1px solid rgba(58, 54, 48, 0.28);
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      }
      #enter:hover {
        background: rgba(58, 54, 48, 0.06);
        border-color: rgba(58, 54, 48, 0.4);
        box-shadow: 0 4px 22px rgba(58, 54, 48, 0.12);
        transform: translateY(-1px);
      }
      #enter:active { transform: translateY(0); }

      .foot {
        position: fixed;
        left: 50%;
        bottom: 5%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.12em;
        padding-left: 0.12em;
        line-height: 1.8;
        text-align: center;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="sun"></div>

    <div class="hand-cursor" id="hand-cursor" aria-hidden="true">
      <svg viewBox="0 0 96 96" role="presentation">
        <path class="hand-warm" d="M35 83c-8-2-14-8-16-16l-4-17c-1.3-5.2 5.4-8.1 8.7-4.1l7.2 8.3-2.7-27.4c-.5-5.1 7.2-6.2 8.1-1.1l3.1 19.2 1.1-31.3c.2-5.3 8.1-5.2 8.1.1v29.8l3.2-24.2c.7-5.1 8.4-4.3 8.2.8l-1.1 26.1 4.5-17.8c1.3-5 8.9-2.9 7.5 2.2l-4.6 21.2c-1.7 7.9-1 12.4 3.2 17.8l4.2 5.3c3.5 4.4.3 10.9-5.3 10.8L43 86.8c-2.8 0-5.5-1.4-8-3.8Z" />
        <path class="hand-fill" d="M35 80.5c-6.8-2.2-11.2-7.3-12.8-14.1l-3.7-15.9c-.7-3 3.1-4.8 5.1-2.3l8.4 10.2c1.5 1.8 4.4.7 4.2-1.7l-2.9-29.7c-.3-3.1 4.3-3.6 4.8-.5l3.5 20.5c.4 2.7 4.5 2.5 4.5-.2l.6-32.7c.1-3.4 5.1-3.4 5.1 0v31.5c0 2.5 3.8 2.7 4.1.2l2.4-25.1c.4-3.4 5.4-2.9 5.1.5l-1.4 27.3c-.1 2.7 3.8 3.2 4.4.6l3.8-17.2c.7-3.2 5.5-1.8 4.7 1.3l-4.5 19.8c-1.7 7.6-.7 12.4 3.2 17.7l3.6 4.8c2.5 3.4.1 8.2-4.1 8.1l-30-1.1c-2.4-.1-4.8-1-6.5-2.6Z" />
      </svg>
    </div>

    <main class="stage">
      <span class="dot"></span>
      <h1>麦浪精灵</h1>
      <p class="sub">Wisp Field</p>
      <button id="enter">进入</button>
    </main>

    <p class="foot">抬起手，唤醒麦田<br />摄像头不可用时自动切换鼠标模式</p>

    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
