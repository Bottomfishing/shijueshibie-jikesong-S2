<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>麦浪精灵 · Wisp Field</title>
    <style>
      /* 进入页：名字未定，标题/副标题均为占位文本，定名后只改下面两处即可。
         视觉沿用体验页语言：晨光底色、小满同款红点、纯色块 + 雾。 */
      :root {
        --sky: #f5efe0;
        --ink: #3a3630;
        --wisp: #c0453a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }

      /* 晨光：中上方的柔光晕，像麦田上将升的太阳 */
      .sun {
        position: fixed;
        left: 50%;
        top: 32%;
        width: min(58vmin, 440px);
        height: min(58vmin, 440px);
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(224, 178, 106, 0.5) 0%,
          rgba(224, 178, 106, 0.16) 45%,
          rgba(224, 178, 106, 0) 70%
        );
        animation: breathe 6s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }

      .stage {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
      }

      /* 小满同款红点：麦田里那颗待唤醒的光 */
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--wisp);
        box-shadow: 0 0 18px rgba(192, 69, 58, 0.55);
        animation: bob 3.2s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      h1 {
        font-size: clamp(30px, 5.4vw, 46px);
        font-weight: 500;
        letter-spacing: 0.3em;
        /* 抵消 letter-spacing 造成的右侧多出的空隙，让文字视觉居中 */
        padding-left: 0.3em;
      }
      .sub {
        font-size: 13px;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        text-transform: uppercase;
        opacity: 0.55;
      }

      #enter {
        margin-top: 20px;
        padding: 13px 44px 13px calc(44px + 0.5em);
        font-family: inherit;
        font-size: 15px;
        letter-spacing: 0.5em;
        color: var(--ink);
        background: transparent;
        border: 1px solid rgba(58, 54, 48, 0.28);
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      }
      #enter:hover {
        background: rgba(58, 54, 48, 0.06);
        border-color: rgba(58, 54, 48, 0.4);
        box-shadow: 0 4px 22px rgba(58, 54, 48, 0.12);
        transform: translateY(-1px);
      }
      #enter:active { transform: translateY(0); }

      .foot {
        position: fixed;
        left: 50%;
        bottom: 5%;
        transform: translateX(-50%);
        font-size: 12px;
        letter-spacing: 0.12em;
        padding-left: 0.12em;
        line-height: 1.8;
        text-align: center;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="sun"></div>

    <main class="stage">
      <span class="dot"></span>
      <h1>麦浪精灵</h1>
      <p class="sub">Wisp Field</p>
      <button id="enter">进入</button>
    </main>

    <p class="foot">抬起手，唤醒麦田<br />摄像头不可用时自动切换鼠标模式</p>

    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
